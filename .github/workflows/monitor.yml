name: monitor

on:
  schedule:
    - cron: "*/30 * * * *"   # 30分おき（GitHubの混雑で数分遅れることがある）
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "monitor/**"
      - ".github/workflows/monitor.yml"

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      # data ブランチは暗号化して保存する（リポジトリを公開しても検知内容を読まれないため）。
      # 鍵は DATA_KEY シークレット。未設定なら NTFY_TOPIC（非公開シークレット）を鍵にする。
      DATA_KEY: ${{ secrets.DATA_KEY || secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - name: Decrypt state
        run: |
          test -n "$DATA_KEY" || { echo "鍵が未設定のため中止（平文で保存しないため）"; exit 1; }
          if [ -f data/state.tar.gz.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:DATA_KEY \
              -in data/state.tar.gz.enc | tar -xzf - -C data
          fi
      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DATA_DIR: data
        run: python3 -m monitor.run
      - name: Encrypt and save state to data branch
        working-directory: data
        run: |
          tar -czf - --exclude=.git --exclude=README.md --exclude=.gitignore --exclude='*.enc' . \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:DATA_KEY -out state.tar.gz.enc
          git config user.name "toreca-arb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.tar.gz.enc
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push -q
