name: monitor

on:
  schedule:
    - cron: "*/30 * * * *"   # 30分おき（GitHubの混雑で数分遅れることがある）
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "monitor/**"
      - ".github/workflows/monitor.yml"

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DATA_DIR: data
        run: python3 -m monitor.run
      - name: Save state to data branch
        working-directory: data
        run: |
          git config user.name "toreca-arb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push -q
