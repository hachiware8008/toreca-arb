name: recon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "recon/urls.txt"
      - "recon/recon.py"
      - ".github/workflows/recon.yml"

permissions:
  contents: write

concurrency:
  group: recon
  cancel-in-progress: false

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run recon
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python recon/recon.py
      - name: Commit results
        run: |
          git config user.name "toreca-arb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f recon/out
          git commit -m "recon: ページ構造調査の結果を保存" || echo "no changes"
          git push
